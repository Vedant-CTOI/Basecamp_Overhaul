<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Tonal Ogilvy tartan — red/ink sett with a pink pinstripe. Used at low
       opacity as ambient bands; heritage texture from the 2021 identity. -->
  <rect width="96" height="96" fill="#231F20"/>
  <g>
    <rect y="0" width="96" height="34" fill="#EB3F43" opacity="0.85"/>
    <rect y="38" width="96" height="4" fill="#F5BAC5" opacity="0.7"/>
    <rect y="46" width="96" height="26" fill="#57191B" opacity="0.9"/>
    <rect y="76" width="96" height="3" fill="#EB3F43" opacity="0.8"/>
    <rect y="84" width="96" height="12" fill="#3A2426" opacity="0.9"/>
  </g>
  <g opacity="0.55">
    <rect x="0" width="34" height="96" fill="#EB3F43" opacity="0.85"/>
    <rect x="38" width="4" height="96" fill="#F5BAC5" opacity="0.7"/>
    <rect x="46" width="26" height="96" fill="#57191B" opacity="0.9"/>
    <rect x="76" width="3" height="96" fill="#EB3F43" opacity="0.8"/>
    <rect x="84" width="12" height="96" fill="#3A2426" opacity="0.9"/>
  </g>
</svg>
